[workspace]
resolver = "2"
members = ["esocial"]


[workspace.dependencies]
serde = { version = "^1.0.0", features = ["derive"] }
serde_with = "^3.0.0"
quick-xml = { version = "^0.30.0", features = ["async-tokio", "serialize"] }
chrono = { version = "^0.4.0", features = ["serde"] }
pad = "^0.1.0"
regex = "^1.0.0"